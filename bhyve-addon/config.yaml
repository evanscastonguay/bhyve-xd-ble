name: B-Hyve XD (local BLE)
version: "1.0.0"
slug: bhyve_xd_ble
description: Local, no-cloud control of an Orbit B-Hyve XD timer over Bluetooth; exposes it to Home Assistant via MQTT.
url: https://github.com/evanscastonguay/bhyve-xd-ble
arch: [aarch64, amd64]
init: false
host_dbus: true
host_network: true
ports:
  8000/tcp: 8000
options:
  address: ""
  network_key: ""
  tz_offset_sec: 0
  stations: 4
  host_scheduling: false
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_default_minutes: 5
schema:
  address: str
  network_key: password
  tz_offset_sec: int
  stations: int(1,8)
  host_scheduling: bool
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_default_minutes: int(1,120)
