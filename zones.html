<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zones · B-Hyve</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 640px; padding: 16px;
         font: 17px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .top { display: flex; align-items: baseline; gap: 12px; }
  a, .muted { color: inherit; opacity: .65; font-size: 14px; }
  button.link { background: none; border: 0; color: inherit; opacity: .65; font-size: 14px;
                cursor: pointer; padding: 0; text-decoration: underline; }
  #status { min-height: 22px; margin: 8px 0 2px; font-weight: 600; }
  #fresh { font-size: 13px; opacity: .55; margin-bottom: 14px; }
  .dur { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; opacity: .85; }
  .dur input { width: 70px; padding: 8px; font-size: 16px; }
  .grp { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; opacity: .6; margin: 14px 0 6px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  button.zone { padding: 22px 0; font-size: 22px; font-weight: 700; border-radius: 14px;
                border: 2px solid #8883; background: #8881; cursor: pointer; position: relative; }
  button.zone.on { background: #14a44d; border-color: #14a44d; color: #fff; }
  button.zone.starting { background: #e8a33d; border-color: #e8a33d; color: #fff;
                         animation: pulse 1s ease-in-out infinite; }
  button.zone.failed { background: #dc4c6422; border-color: #dc4c64; color: #dc4c64; }
  button.zone .tag { position: absolute; top: 4px; right: 7px; font-size: 12px; font-weight: 600; }
  @keyframes pulse { 50% { opacity: .5; } }
  #stop { width: 100%; margin-top: 22px; padding: 20px; font-size: 20px; font-weight: 700;
          border-radius: 14px; border: 0; background: #dc4c64; color: #fff; cursor: pointer; }
  #stop:active, button.zone:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div class="top"><h1>Zones</h1><a href="/">full controls &rsaquo;</a>
    <button class="link" onclick="refresh()">↻ refresh</button></div>
  <div id="status">…</div>
  <div id="fresh"></div>
  <div class="dur"><label>Run for</label><input id="mins" type="number" min="1" max="120" value="60"><span>min</span></div>
  <div id="grid"></div>
  <button id="stop" onclick="stopAll()">■ STOP ALL</button>

<script>
const $ = s => document.querySelector(s);
let zones = [], starting = null, failed = {}, lastLoad = 0, busyStop = false;

async function api(method, path, body, timeoutMs = 15000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const opt = { method, headers: { "Content-Type": "application/json" }, signal: ctl.signal };
    if (body) opt.body = JSON.stringify(body);
    const r = await fetch(path, opt);
    let d; try { d = await r.json(); } catch { d = {}; }
    if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
    return d;
  } finally { clearTimeout(t); }
}

function render() {
  const g = $("#grid"); g.innerHTML = "";
  let curDev = null, box = null;
  for (const z of zones) {
    if (z.device !== curDev) {
      curDev = z.device;
      const h = document.createElement("div"); h.className = "grp"; h.textContent = z.name; g.appendChild(h);
      box = document.createElement("div"); box.className = "row"; g.appendChild(box);
    }
    const b = document.createElement("button");
    const state = starting === z.n ? "starting" : failed[z.n] ? "failed" : z.active ? "on" : "";
    b.className = "zone" + (state ? " " + state : "");
    b.innerHTML = z.n + (state === "failed" ? '<span class="tag">✗</span>'
                        : state === "on" ? '<span class="tag">on</span>' : "");
    b.title = z.name + " · valve " + z.zone + (failed[z.n] ? " — " + failed[z.n] : "");
    b.onclick = () => startZone(z);
    box.appendChild(b);
  }
  const a = zones.find(z => z.active), fz = Object.keys(failed);
  $("#status").textContent =
      starting !== null ? ("starting zone " + starting + "… (up to ~30s)")
    : fz.length ? ("zone " + fz[0] + " didn't start — " + failed[fz[0]] + " (tap it to retry)")
    : a ? ("ON: zone " + a.n + " — " + a.name + (a.seconds_remaining ? " · " + a.seconds_remaining + "s left" : ""))
        : "all off";
}

function tickFresh() {
  if (!lastLoad) return;
  $("#fresh").textContent = "updated " + Math.round((Date.now() - lastLoad) / 1000) + "s ago";
}

async function load(reconcile) {
  if (starting !== null || busyStop) return;   // never clobber an in-flight action; never stalls (both clear in finally)
  try {
    const r = await api("GET", "/api/zones" + (reconcile ? "?reconcile=1" : ""), null, reconcile ? 40000 : 8000);
    zones = r.zones; lastLoad = Date.now();
    for (const z of zones) if (z.active && failed[z.n]) delete failed[z.n];   // recovered
    render(); tickFresh();
  } catch (e) { /* transient; next poll retries */ }
}
function refresh() { load(true); }

async function startZone(z) {
  if (starting !== null) return;
  starting = z.n; delete failed[z.n];
  for (const x of zones) x.active = (x.n === z.n);   // optimistic while we confirm
  render();
  const mins = parseFloat($("#mins").value) || 60;
  try {
    const r = await api("POST", "/api/zones/start", { device: z.device, zone: z.zone, minutes: mins }, 45000);
    if (r.ok) failed = {}; else failed[z.n] = r.reason || "not confirmed";
  } catch (e) {
    failed[z.n] = (e.name === "AbortError") ? "timed out — tap to retry" : "no response — tap to retry";
  }
  starting = null;
  await load(true);              // reconcile against real state after the action
}

async function stopAll() {
  busyStop = true; starting = null; failed = {};
  for (const x of zones) x.active = false; render();
  try { await api("POST", "/api/zones/stop-all", null, 45000); }
  catch (e) { $("#status").textContent = "✗ stop: " + e.message; }
  busyStop = false;
  await load(true);
}

load(true);                      // reconcile true state on open
setInterval(() => load(false), 5000);
setInterval(tickFresh, 1000);
</script>
</body>
</html>
